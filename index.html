<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amino Chat</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f1f3f8;color:#222}
header{background:#6750a4;color:white;padding:18px;text-align:center;font-size:24px;font-weight:bold}
.amino-title{margin:0;text-align:center;color:white}
.rabbit{display:inline-block;animation:rabbitJump 1s ease-in-out infinite}
.rabbit:last-of-type{animation-delay:.5s}
@keyframes rabbitJump{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
main{max-width:650px;margin:20px auto;padding:16px}
#login,#chat{background:white;padding:18px;border-radius:14px;box-shadow:0 2px 10px #0001}
input,button{box-sizing:border-box;padding:12px;border-radius:8px;font-size:16px}
input{border:1px solid #ccc}#name,#chatPassword{width:100%;margin:12px 0}
button{border:0;background:#6750a4;color:white;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}
#enter{width:100%}#messages{height:55vh;min-height:260px;overflow-y:auto;border:1px solid #ddd;padding:10px;margin:12px 0;border-radius:8px;overflow-wrap:anywhere;background-image:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)),url("./chat-bg.jpg");background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:local}
.message{background:rgba(255,255,255,.92);padding:10px;margin:8px 0;border-radius:12px;overflow-wrap:anywhere;border:2px solid #E91E63;border-left-width:6px}
.sender{font-weight:bold;color:#6750a4;margin-bottom:5px}.message-body{color:#222;line-height:1.5;white-space:pre-wrap}
.message-image{display:block;max-width:100%;max-height:360px;object-fit:contain;margin-top:8px;border-radius:8px;cursor:pointer}
.system-message{width:fit-content;max-width:95%;box-sizing:border-box;margin:12px auto;padding:7px 12px;border-radius:999px;background:#f3e8ff;color:#6750a4;text-align:center;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.system-time{display:inline-block;margin-left:6px;color:#999;font-size:11px;white-space:nowrap}
#composer{display:flex;gap:8px;align-items:stretch}#message{flex:1;min-width:0}#imageButton{flex:0 0 auto;padding:10px 12px;font-size:20px}#status{color:#666;font-size:14px}#passwordError{color:red}#chatStatus{font-size:14px;color:#6750a4;overflow-wrap:anywhere}
.floating-heart{position:fixed;z-index:9999;pointer-events:none;user-select:none;line-height:1;animation:heartFly 1.35s ease-out forwards;will-change:transform,opacity}
@keyframes heartFly{0%{opacity:0;transform:translate(-50%,0) scale(.5) rotate(0deg)}15%{opacity:1;transform:translate(-50%,-12px) scale(1.1) rotate(-8deg)}100%{opacity:0;transform:translate(calc(-50% + var(--drift)),-150px) scale(.8) rotate(18deg)}}
@media(max-width:420px){main{padding:10px}#login,#chat{padding:14px}#composer{gap:6px}#imageButton{padding:10px;font-size:18px}#composer button[type="submit"]{padding:10px}}
@media(prefers-reduced-motion:reduce){.rabbit{animation:none}.floating-heart{animation-duration:.7s}}
</style>
</head>
<body>
<header><h1 class="amino-title"><span class="rabbit">🐰</span> Amino Chat <span class="rabbit">🐇</span></h1></header>
<main>
<section id="login">
<p>Nhập mật khẩu để vào Amino Chat</p>
<input id="chatPassword" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password">
<p id="passwordError" aria-live="polite"></p>
<h3>Chào mừng đến Amino Chat!</h3><p>Nhập tên của bạn để vào phòng chat cùng Amino nhé.</p>
<input id="name" maxlength="24" placeholder="Tên hiển thị của bạn">
<button id="enter" type="button">Vào chat thui 👆</button><p id="status">Sẵn sàng kết nối.</p>
</section>
<section id="chat" hidden>
<h3>Phòng chat chung</h3><p id="welcome"></p><div id="messages"></div>
<form id="composer">
<input id="message" maxlength="1000" placeholder="Nhập tin nhắn ở đây nè cậu..." autocomplete="off" required>
<button id="imageButton" type="button" title="Chọn ảnh" aria-label="Chọn ảnh">📷</button>
<input id="imageInput" type="file" accept="image/*" hidden>
<button type="submit">Gửi</button>
</form>
<p id="chatStatus" aria-live="polite"></p>
</section>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import { getDatabase, ref, push, set, onValue, query, orderByChild, limitToLast, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAlJdZGJYij_AOYMEawBgYnBRkBeHOsoeg",
  authDomain: "amino-c6032.firebaseapp.com",
  databaseURL: "https://amino-c6032-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "amino-c6032",
  appId: "1:659773931860:web:c101fc013c28a1b4e508c1"
};
const login=document.getElementById("login"), chat=document.getElementById("chat"), status=document.getElementById("status"), chatStatus=document.getElementById("chatStatus"), messages=document.getElementById("messages"), enter=document.getElementById("enter"), passwordInput=document.getElementById("chatPassword"), passwordError=document.getElementById("passwordError"), nameInput=document.getElementById("name"), composer=document.getElementById("composer"), messageInput=document.getElementById("message"), imageButton=document.getElementById("imageButton"), imageInput=document.getElementById("imageInput");
let db,user,displayName,app,auth;
function formatTime(timestamp){if(typeof timestamp!=="number")return "";return new Date(timestamp).toLocaleTimeString("vi-VN",{timeZone:"Asia/Ho_Chi_Minh",hour:"2-digit",minute:"2-digit",hour12:false});}
function floatHearts(){const hearts=["💗","💕","💖","💘","❤️","💓"],button=composer.querySelector('button[type="submit"]'),rect=button.getBoundingClientRect(),originX=rect.left+rect.width/2,originY=rect.top+rect.height/2,count=5+Math.floor(Math.random()*4);for(let i=0;i<count;i++){const heart=document.createElement("span");heart.className="floating-heart";heart.textContent=hearts[Math.floor(Math.random()*hearts.length)];heart.style.left=`${originX+(Math.random()-.5)*90}px`;heart.style.top=`${originY}px`;heart.style.fontSize=`${16+Math.random()*15}px`;heart.style.setProperty("--drift",`${(Math.random()-.5)*100}px`);heart.style.animationDelay=`${Math.random()*.18}s`;document.body.appendChild(heart);heart.addEventListener("animationend",()=>heart.remove(),{once:true});}}
function addMessageToScreen(data){const box=document.createElement("div");if(data.name==="Thông báo hệ thống"){box.className="system-message";const noticeText=document.createElement("span");noticeText.textContent=data.text||"";const noticeTime=document.createElement("span");noticeTime.className="system-time";noticeTime.textContent=formatTime(data.createdAt);box.append(noticeText,noticeTime);messages.append(box);return;}box.className="message";const senderId=String(data.uid||data.name||"guest");let hash=0;for(let i=0;i<senderId.length;i++)hash=(hash*31+senderId.charCodeAt(i))|0;const colors=["#FCE4EC","#E3F2FD","#E8F5E9","#FFF3E0","#F3E5F5","#E0F7FA","#FFF9C4","#EDE7F6"],color=colors[Math.abs(hash)%colors.length];box.style.backgroundColor=color;box.style.borderColor=color;box.style.borderLeftColor="#E91E63";const sender=document.createElement("div");sender.className="sender";sender.textContent=data.name||"Khách";box.append(sender);if(data.text){const body=document.createElement("div");body.className="message-body";body.textContent=data.text;box.append(body);}if(typeof data.imageData==="string"&&data.imageData.startsWith("data:image/")){const img=document.createElement("img");img.className="message-image";img.src=data.imageData;img.alt="Ảnh được gửi trong Amino Chat";img.loading="lazy";img.addEventListener("click",()=>window.open(img.src,"_blank","noopener"));box.append(img);}const time=document.createElement("small");time.style.display="block";time.style.color="#777";time.style.fontSize="12px";time.textContent=typeof data.createdAt==="number"?formatTime(data.createdAt):"Đang cập nhật giờ...";box.append(time);messages.append(box);}
enter.addEventListener("click",async()=>{passwordError.textContent="";chatStatus.textContent="";if(passwordInput.value!=="1409"){passwordError.textContent="Mật khẩu không đúng!";passwordInput.focus();return;}displayName=nameInput.value.trim();if(!displayName){status.textContent="Bạn hãy nhập tên trước nhé.";nameInput.focus();return;}enter.disabled=true;status.textContent="Đang kết nối...";try{if(!app){app=initializeApp(firebaseConfig);auth=getAuth(app);db=getDatabase(app);}const result=await signInAnonymously(auth);user=result.user;login.hidden=true;chat.hidden=false;document.getElementById("welcome").textContent="Bạn đang trò chuyện với tên "+displayName;const recent=query(ref(db,"publicChat/messages"),orderByChild("createdAt"),limitToLast(100));onValue(recent,snapshot=>{messages.replaceChildren();snapshot.forEach(item=>addMessageToScreen(item.val()||{}));messages.scrollTop=messages.scrollHeight;},error=>{console.error("Lỗi đọc tin nhắn:",error);chatStatus.textContent="Không đọc được tin nhắn. Hãy kiểm tra quyền Realtime Database.";});chatStatus.textContent="Đã kết nối.";set(push(ref(db,"publicChat/messages")),{uid:user.uid,name:"Thông báo hệ thống",text:`Người dùng ${displayName} đã vào chat`,createdAt:serverTimestamp()}).catch(error=>{console.error("Không gửi được thông báo:",error);chatStatus.textContent="Đã vào chat nhưng không gửi được thông báo. Hãy kiểm tra quyền ghi Firebase.";});}catch(error){console.error("Lỗi đăng nhập Firebase:",error);status.textContent="Không kết nối được Firebase: "+(error.code||error.message||"Lỗi không xác định");enter.disabled=false;}});
passwordInput.addEventListener("keydown",event=>{if(event.key==="Enter")enter.click();});nameInput.addEventListener("keydown",event=>{if(event.key==="Enter")enter.click();});
composer.addEventListener("submit",async event=>{event.preventDefault();const text=messageInput.value.trim();if(!text||!user||!db)return;const submitButton=composer.querySelector('button[type="submit"]');submitButton.disabled=true;try{await set(push(ref(db,"publicChat/messages")),{uid:user.uid,name:displayName,text,createdAt:serverTimestamp()});floatHearts();messageInput.value="";chatStatus.textContent="";messageInput.focus();}catch(error){console.error("Lỗi gửi tin nhắn:",error);chatStatus.textContent="Gửi chưa được. Cần kiểm tra quyền Realtime Database.";}finally{submitButton.disabled=false;}});
imageButton.addEventListener("click",()=>{if(!user||!db){chatStatus.textContent="Bạn cần vào phòng chat trước nhé.";return;}imageInput.click();});
imageInput.addEventListener("change",async()=>{const file=imageInput.files&&imageInput.files[0];imageInput.value="";if(!file)return;if(!file.type.startsWith("image/")){chatStatus.textContent="Hãy chọn một file ảnh nhé.";return;}if(file.size>12*1024*1024){chatStatus.textContent="Ảnh gốc quá lớn (trên 12 MB). Hãy chọn ảnh nhỏ hơn.";return;}imageButton.disabled=true;chatStatus.textContent="Đang xử lý và gửi ảnh...";try{const imageData=await compressImage(file);await set(push(ref(db,"publicChat/messages")),{uid:user.uid,name:displayName,text:messageInput.value.trim(),imageData,createdAt:serverTimestamp()});messageInput.value="";chatStatus.textContent="Đã gửi ảnh 💗";floatHearts();}catch(error){console.error("Lỗi gửi ảnh:",error);chatStatus.textContent="Gửi ảnh chưa được. Có thể ảnh quá lớn hoặc Firebase chưa cho phép ghi dữ liệu.";}finally{imageButton.disabled=false;}});
function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error("Không đọc được file ảnh"));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error("File ảnh không hợp lệ"));img.onload=()=>{const maxSide=1000,scale=Math.min(1,maxSide/Math.max(img.width,img.height)),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext("2d");if(!ctx){reject(new Error("Không xử lý được ảnh"));return;}ctx.drawImage(img,0,0,canvas.width,canvas.height);const data=canvas.toDataURL("image/jpeg",0.72);if(data.length>900000){resolve(canvas.toDataURL("image/jpeg",0.5));}else{resolve(data);}};img.src=reader.result;};reader.readAsDataURL(file);});}
</script>
</body>
</html>
