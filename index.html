
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amino Chat</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f8;
      color: #222;
    }
    header {
      background: #6750a4;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }
    main {
      max-width: 650px;
      margin: 20px auto;
      padding: 16px;
    }
    #login, #chat {
      background: white;
      padding: 18px;
      border-radius: 14px;
      box-shadow: 0 2px 10px #0001;
    }
    input, button {
      box-sizing: border-box;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #ccc; }
    #name { width: 100%; margin: 12px 0; }
    button {
      border: 0;
      background: #6750a4;
      color: white;
      cursor: pointer;
    }
    #enter { width: 100%; }

#messages {
  height: 55vh;
  min-height: 260px;
  overflow-y: auto;
  border: 1px solid #ddd;
  padding: 10px;
  margin: 12px 0;
  border-radius: 8px;
  overflow-wrap: anywhere;

  /* Ảnh nền khu vực trò chuyện */
  background-image:
    linear-gradient(
      rgba(255, 255, 255, 0.35),
      rgba(255, 255, 255, 0.35)
    ),
    url("./chat-bg.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: local;
}

.message {
  background: rgba(255, 255, 255, 0.82);
  padding: 10px;
  margin: 8px 0;
  border-radius: 10px;
  overflow-wrap: anywhere;
}
    .sender { font-weight: bold; color: #6750a4; }
    #composer { display: flex; gap: 8px; }
    #message { flex: 1; min-width: 0; }
    #status { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <header>💬 Amino Chat🐇 </header>
  <main>
    <section id="login">
      <h3>Chào mừng đến Amino chat!</h3>
      <p>Nhập tên của bạn để vào phòng chat cùng Amino nhé.</p>
      <input id="name" maxlength="24" placeholder="Tên hiển thị của bạn">
      <button id="enter">Vào phòng chat</button>
      <p id="status">Chưa kết nối Firebase.</p>
    </section>

    <section id="chat" hidden>
      <h3>Phòng chat chung</h3>
      <p id="welcome"></p>
      <div id="messages"></div>
      <form id="composer">
        <input id="message" maxlength="1000"
          placeholder="Nhập tin nhắn ở đây nè cậu..." autocomplete="off" required>
        <button type="submit">Gửi</button>
      </form>
      <p id="chatStatus"></p>
    </section>
  </main>

  <script type="module">
    // BƯỚC SAU: thay cấu hình mẫu bằng cấu hình Firebase thật.
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAuth, signInAnonymously } from
      "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import {
      getDatabase, ref, push, set, onValue,
      query, orderByChild, limitToLast, serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

   const firebaseConfig = {
  apiKey: "AIzaSyAlJdZGJYij_AOYMEawBgYnBRkBeHOsoeg",
  authDomain: "amino-c6032.firebaseapp.com",
  databaseURL: "https://amino-c6032-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "amino-c6032",
  appId: "1:659773931860:web:c101fc013c28a1b4e508c1"
    };

    const login = document.getElementById("login");
    const chat = document.getElementById("chat");
    const status = document.getElementById("status");
    const chatStatus = document.getElementById("chatStatus");
    const messages = document.getElementById("messages");
    const enter = document.getElementById("enter");

    let db, user, displayName;

    enter.addEventListener("click", async () => {
      displayName = document.getElementById("name").value.trim();
      if (!displayName) {
        status.textContent = "Bạn hãy nhập tên trước nhé.";
        return;
      }

      enter.disabled = true;
      status.textContent = "Đang kết nối...";
      try {
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        db = getDatabase(app);
        const result = await signInAnonymously(auth);
        user = result.user;

        login.hidden = true;
        chat.hidden = false;
        document.getElementById("welcome").textContent =
          "Bạn đang trò chuyện với tên " + displayName;

        const recent = query(
          ref(db, "publicChat/messages"),
          orderByChild("createdAt"),
          limitToLast(100)
        );

        onValue(recent, snapshot => {
          messages.replaceChildren();
          snapshot.forEach(item => {
            const data = item.val();
            const box = document.createElement("div");
            box.className = "message";
            const sender = document.createElement("div");
            sender.className = "sender";
            sender.textContent = data.name || "Khách";

const body = document.createElement("div");
body.textContent = data.text || "";

const time = document.createElement("small");
time.style.display = "block";
time.style.color = "#777";
time.style.fontSize = "12px";

if (typeof data.createdAt === "number") {
  time.textContent = new Date(data.createdAt).toLocaleTimeString(
    "vi-VN",
    { hour: "2-digit", minute: "2-digit", hour12: false }
  );
} else {
  time.textContent = "Đang cập nhật giờ...";
}

box.append(sender, body, time);
            messages.append(box);
          });
          messages.scrollTop = messages.scrollHeight;
        });

        chatStatus.textContent = "Đã kết nối.";
      } catch (error) {
        status.textContent =
          "Chưa kết nối được. Kiểm tra cấu hình Firebase và Authentication.";
        enter.disabled = false;
        console.error(error);
      }
    });

    document.getElementById("composer").addEventListener(
      "submit", async event => {
        event.preventDefault();
        const input = document.getElementById("message");
        const text = input.value.trim();
        if (!text || !user || !db) return;

        try {
          await set(push(ref(db, "publicChat/messages")), {
            uid: user.uid,
            name: displayName,
            text: text,
            createdAt: serverTimestamp()
          });
          input.value = "";
          chatStatus.textContent = "";
        } catch (error) {
          chatStatus.textContent =
            "Gửi chưa được. Cần kiểm tra quyền Database.";
        }
      }
    );
  </script>
</body>
</html>
