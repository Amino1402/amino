<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amino Chat</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f3f8;color:#222}
main{max-width:1000px;margin:20px auto;padding:16px}
#login,#chat{background:white;padding:18px;border-radius:14px;box-shadow:0 2px 10px #0001}
input,button{padding:12px;border-radius:8px;font-size:15px}
input{border:1px solid #ccc;min-width:0}
button{border:0;background:#6750a4;color:white;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
#name,#chatPassword{width:100%;margin:12px 0}
#enter{width:100%}
#passwordError{color:red}
#status,#chatStatus{font-size:13px;color:#666}
#chatLayout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px}
#chatMain,#sidePanel{min-width:0}
#messages{
 height:55vh;min-height:260px;overflow:auto;border:1px solid #ddd;
 padding:10px;margin:12px 0;border-radius:8px;
 background-image:linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.25)),url("./chat-bg.jpg");
 background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:local
}
.message{padding:10px;margin:8px 0;border:2px solid #e91e63;border-left-width:6px;border-radius:12px;overflow-wrap:anywhere}
.message-header{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:5px}
.sender{display:inline;font-size:12px;font-weight:bold;color:#6750a4;margin:0}
.message-time{color:#999;font-size:10px;font-weight:normal}
.message-body{white-space:pre-wrap;line-height:1.5}
.system-message{width:fit-content;max-width:95%;margin:12px auto;padding:7px 12px;border-radius:999px;background:#f3e8ff;color:#6750a4;font-size:13px;overflow-wrap:anywhere}
.system-time{margin-left:6px;color:#999;font-size:11px}
#composer{display:flex;gap:8px}
#message{flex:1;width:100%}
#typingIndicator{margin:5px 2px 8px;font-size:12px;color:#6750a4;line-height:1.45;overflow-wrap:anywhere}
.typing-user{padding:7px 9px;margin:5px 0;background:#f5f0ff;border-radius:8px;border-left:3px solid #a78bfa}
.typing-draft{color:#444;white-space:pre-wrap;overflow-wrap:anywhere}
#onlinePanel,#musicPanel{border:1px solid #e1dced;border-radius:12px;background:white;padding:14px}
.online-heading,.music-heading{font-weight:bold;color:#6750a4;margin-bottom:10px}
#onlineList{display:flex;flex-direction:column;gap:8px}
.online-user{display:flex;align-items:center;gap:8px;padding:9px;background:#f5f2fc;border-radius:9px;overflow-wrap:anywhere}
.online-dot{color:#16a34a}
.online-name{font-size:14px;overflow-wrap:anywhere}
#onlineEmpty{font-size:13px;color:#777}
#musicPanel{margin-top:14px}
#musicForm{display:flex;gap:6px}
#musicQuery{width:100%;font-size:13px}
#musicForm button{flex-shrink:0}
#musicError{font-size:12px;color:#b42318;line-height:1.5;overflow-wrap:anywhere}
#musicResults{display:flex;flex-direction:column;gap:8px;margin-top:10px}
#musicResults.hidden{display:none}
.song{display:flex;gap:8px;align-items:center;text-align:left;background:#f5f2fc;color:#222;padding:7px;width:100%;border:1px solid #e5def5}
.song img{width:84px;aspect-ratio:16/9;object-fit:cover;border-radius:5px;flex-shrink:0}
.song-title{font-size:13px;font-weight:bold;line-height:1.3}
.song-channel{font-size:11px;color:#666;margin-top:4px}
#playerWrap{margin-top:10px;width:100%;aspect-ratio:16/9;background:#111;border-radius:8px;overflow:hidden}
#player{width:100%;height:100%}
.hint{font-size:12px;color:#777;line-height:1.5}
#syncStatus{font-size:12px;line-height:1.5;color:#6750a4;margin-top:8px;overflow-wrap:anywhere}
.floating-heart{position:fixed;z-index:9999;pointer-events:none;animation:heartFly 1.3s ease-out forwards}
@keyframes heartFly{0%{opacity:0;transform:translate(-50%,0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--drift)),-140px) scale(.8)}}
@media(max-width:700px){
 main{margin:10px auto;padding:10px}
 #chatLayout{grid-template-columns:1fr}
 #onlineList{flex-direction:row;flex-wrap:wrap}
 #musicForm{flex-direction:column}
 #musicForm button{width:100%}
}
@media(prefers-reduced-motion:reduce){.floating-heart{animation:none}}
</style>
</head>

<body>

<main>
<section id="login">
<p>Nhập mật khẩu để vào Amino Chat</p>
<input id="chatPassword" type="password" placeholder="Nhập mật khẩu">
<p id="passwordError" aria-live="polite"></p>
<h3>Chào mừng đến Amino Chat!</h3>
<p>Nhập tên của bạn để vào phòng chat cùng Amino nhé.</p>
<input id="name" maxlength="24" placeholder="Tên hiển thị của bạn">
<button id="enter" type="button">Vào chat thui 👆</button>
<p id="status">Sẵn sàng kết nối.</p>
</section>

<section id="chat" hidden>
<div id="chatLayout">
<div id="chatMain">
<div id="messages"></div>
<form id="composer">
<input id="message" maxlength="1000" placeholder="Nhập tin nhắn ở đây nè cậu..." autocomplete="off" required>
<button type="submit">Gửi</button>
</form>
<div id="typingIndicator" aria-live="polite"></div>
<p id="chatStatus" aria-live="polite"></p>
</div>

<div id="sidePanel">
<aside id="onlinePanel">
<div class="online-heading">👥 Đang trực tuyến (<span id="onlineCount">0</span>)</div>
<div id="onlineList"><div id="onlineEmpty">Đang tải danh sách...</div></div>
</aside>

<section id="musicPanel">
<div class="music-heading">🎵 Nhạc chung cả phòng</div>
<div class="hint">Mọi người đều có thể tìm và đổi bài hát.</div>
<form id="musicForm">
<input id="musicQuery" placeholder="Nhập tên bài hát / ca sĩ..." required>
<button type="submit">Tìm</button>
</form>
<p id="musicError" aria-live="polite"></p>
<div id="musicResults"></div>
<div id="playerWrap" hidden><div id="player"></div></div>
<div id="syncStatus" aria-live="polite">Đang chờ bài hát đầu tiên.</div>
</section>
</div>
</div>
</section>
</main>

<script>
(function(){
 const tag=document.createElement("script");
 tag.src="https://www.youtube.com/iframe_api";
 document.head.appendChild(tag);
})();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {
 getDatabase,ref,push,set,onValue,query,orderByChild,
 limitToLast,onDisconnect,serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

/* FIREBASE */
const firebaseConfig={
 apiKey:"AIzaSyAlJdZGJYij_AOYMEawBgYnBRkBeHOsoeg",
 authDomain:"amino-c6032.firebaseapp.com",
 databaseURL:"https://amino-c6032-default-rtdb.asia-southeast1.firebasedatabase.app/",
 projectId:"amino-c6032",
 appId:"1:659773931860:web:c101fc013c28a1b4e508c1"
};

/* YOUTUBE API KEY */
const YOUTUBE_API_KEY="AIzaSyB7iduznYdwJQbY4x6uWDlXjSS-Gz6dqdQ";

const $=id=>document.getElementById(id);
const messages=$("messages");

let app,auth,db,user,displayName;
let player=null,playerReady=false;
let currentVideoId="",latestMusicState=null;
let applyingRemoteState=false;
let lastAppliedRevision=null;
let lastWriteAt=0;
let presenceStarted=false,musicListenerStarted=false;
let applyingTimer=null;

/* LIVE TYPING */
let typingListenerStarted=false;
let typingWriteTimer=null,typingClearTimer=null;
let lastTypingText="";

function musicStateRef(){return ref(db,"roomMusic/state")}

function formatTime(timestamp){
 if(typeof timestamp!=="number")return "";
 return new Date(timestamp).toLocaleTimeString("vi-VN",{
  timeZone:"Asia/Ho_Chi_Minh",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false
 });
}

function setMusicError(message){$("musicError").textContent=message}

function floatHearts(){
 const button=$("composer").querySelector('button[type="submit"]');
 const rect=button.getBoundingClientRect();
 const hearts=["💗","💕","💖","💘","❤️","💓"];
 for(let i=0;i<5;i++){
  const heart=document.createElement("span");
  heart.className="floating-heart";
  heart.textContent=hearts[Math.floor(Math.random()*hearts.length)];
  heart.style.left=(rect.left+rect.width/2+(Math.random()-.5)*80)+"px";
  heart.style.top=rect.top+rect.height/2+"px";
  heart.style.fontSize=(16+Math.random()*14)+"px";
  heart.style.setProperty("--drift",((Math.random()-.5)*90)+"px");
  document.body.append(heart);
  heart.addEventListener("animationend",()=>heart.remove(),{once:true});
 }
}

/* ONLINE */
function startPresence(){
 if(presenceStarted)return;
 presenceStarted=true;

 onValue(ref(db,".info/connected"),async snapshot=>{
  if(snapshot.val()!==true)return;
const connectionRef=push(ref(db,`presence/${user.uid}/connections`));

try{
 // Chuẩn bị thông báo khi kết nối bị ngắt
 const leaveMessageRef=push(ref(db,"publicChat/messages"));

 await onDisconnect(leaveMessageRef).set({
  uid:user.uid,
  name:"Thông báo hệ thống",
  text:displayName+" đã rời phòng",
  createdAt:serverTimestamp()
 });

 // Tự xóa trạng thái kết nối khi mất kết nối
 await onDisconnect(connectionRef).remove();

 await set(ref(db,`presence/${user.uid}/name`),displayName);
 await set(connectionRef,true);
  }catch(error){
   $("chatStatus").textContent="Lỗi online: "+error.message;
  }
 });

 onValue(ref(db,"presence"),snapshot=>{
  const list=$("onlineList");
  list.replaceChildren();
  let count=0;

  snapshot.forEach(item=>{
   const data=item.val()||{};
   if(!Object.keys(data.connections||{}).length)return;
   count++;
   const member=document.createElement("div");
   member.className="online-user";
   const dot=document.createElement("span");
   dot.className="online-dot";
   dot.textContent="●";
   const name=document.createElement("span");
   name.className="online-name";
   name.textContent=data.name||"Khách";
   member.append(dot,name);
   list.append(member);
  });

  $("onlineCount").textContent=String(count);
  if(!count){
   const empty=document.createElement("div");
   empty.id="onlineEmpty";
   empty.textContent="Chưa có ai trực tuyến.";
   list.append(empty);
  }
 },error=>{
  $("chatStatus").textContent="Không tải được online: "+error.message;
 });
}

/* HIỂN THỊ NỘI DUNG ĐANG GÕ CHO NHỮNG NGƯỜI KHÁC */
function myTypingRef(){
 return ref(db,`typing/${user.uid}`);
}

async function publishTypingDraft(){
 if(!user||!db)return;
 const text=$("message").value;
 const ownRef=myTypingRef();
 clearTimeout(typingClearTimer);

 if(!text.trim()){
  lastTypingText="";
  try{await set(ownRef,null)}catch(error){console.warn("Không xóa được trạng thái nhập:",error)}
  return;
 }

 if(text===lastTypingText)return;
 lastTypingText=text;

 try{
  await set(ownRef,{
   uid:user.uid,
   name:displayName,
   text:text.slice(0,1000),
   updatedAt:Date.now()
  });
 }catch(error){
  console.warn("Không cập nhật được nội dung đang nhập:",error);
 }

 // Dọn bản nháp nếu người dùng ngừng gõ 12 giây.
 typingClearTimer=setTimeout(async()=>{
  if(!user)return;
  if($("message").value===text){
   try{await set(ownRef,null)}catch(error){console.warn("Không dọn được bản nháp:",error)}
   lastTypingText="";
  }
 },12000);
}

function startTypingSync(){
 if(typingListenerStarted)return;
 typingListenerStarted=true;

 $("message").addEventListener("input",()=>{
  clearTimeout(typingWriteTimer);
  typingWriteTimer=setTimeout(publishTypingDraft,150);
 });

 onDisconnect(myTypingRef()).remove().catch(error=>{
  console.warn("Không đăng ký được dọn trạng thái nhập:",error);
 });

 onValue(ref(db,"typing"),snapshot=>{
  const container=$("typingIndicator");
  container.replaceChildren();
  const now=Date.now();
  let count=0;

  snapshot.forEach(child=>{
   const data=child.val();
   if(!data||child.key===user.uid||typeof data.text!=="string"||!data.text.trim())return;
   if(now-(Number(data.updatedAt)||0)>15000)return;

   count++;
   const row=document.createElement("div");
   row.className="typing-user";
   const label=document.createElement("strong");
   label.textContent=(data.name||"Ai đó")+" đang nhập:";
   const draft=document.createElement("div");
   draft.className="typing-draft";
   draft.textContent=data.text;
   row.append(label,draft);
   container.append(row);
  });

  if(!count)container.replaceChildren();
 },error=>{
  $("chatStatus").textContent="Không đọc được nội dung đang nhập: "+error.message;
 });
}

/* YOUTUBE PLAYER */
window.onYouTubeIframeAPIReady=()=>createPlayer();

function createPlayer(){
 if(player||!window.YT?.Player)return;

 player=new YT.Player("player",{
  width:"100%",height:"100%",
  playerVars:{autoplay:0,controls:1,playsinline:1,rel:0},
  events:{
   onReady:()=>{
    playerReady=true;
    if(latestMusicState)applyMusicState(latestMusicState,true);
   },
   onStateChange:event=>{
    if(applyingRemoteState||!currentVideoId||!user)return;
    if(event.data===YT.PlayerState.PLAYING)publishPlayerState(true);
    async function publishPlayerState(playing){
 if(!playerReady||!currentVideoId||!user||applyingRemoteState)return;
 if(latestMusicState?.changedBy!==user.uid)return;
 const now=Date.now();

 const state={
  videoId:currentVideoId,
  title:latestMusicState?.title||"Nhạc YouTube",
  position:Number(player.getCurrentTime?.())||0,
  playing:!!playing,
  updatedAt:now,
  revision:latestMusicState?.revision||now,
  changedBy:user.uid
 };
 latestMusicState=state;
 try{await set(musicStateRef(),state)}
 catch(error){$("syncStatus").textContent="Không cập nhật được nhạc: "+error.message}
}

function targetPosition(state){
 const position=Number(state.position)||0;
 if(!state.playing)return position;
 return position+Math.max(0,Date.now()-(Number(state.updatedAt)||Date.now()))/1000;
}

function applyMusicState(state,force=false){
 if(!state?.videoId||!playerReady||!player)return;
 const changed=state.videoId!==currentVideoId;
 const target=targetPosition(state);

 if(changed){
  currentVideoId=state.videoId;
  $("playerWrap").hidden=false;
  setMusicError("🎵 Bài đang phát: "+(state.title||"Nhạc YouTube"));
 }

 applyingRemoteState=true;
 if(applyingTimer)clearTimeout(applyingTimer);

 try{
  if(changed){
   if(state.playing)player.loadVideoById({videoId:state.videoId,startSeconds:target});
   else player.cueVideoById({videoId:state.videoId,startSeconds:target});
  }else{
   const actual=Number(player.getCurrentTime?.())||0;
   if(force||Math.abs(actual-target)>2.5)player.seekTo(target,true);
   const playerState=player.getPlayerState?.();
   if(state.playing&&playerState!==YT.PlayerState.PLAYING)player.playVideo();
   else if(!state.playing&&playerState===YT.PlayerState.PLAYING)player.pauseVideo();
  }
  $("syncStatus").textContent=state.playing?"🎵 Đang đồng bộ nhạc chung.":"⏸ Nhạc đang tạm dừng.";
 }catch(error){
  $("syncStatus").textContent="Không đồng bộ được. Hãy thử bấm phát video.";
 }
 applyingTimer=setTimeout(()=>{applyingRemoteState=false},900);
}

function startMusicSync(){
 if(musicListenerStarted)return;
 musicListenerStarted=true;

 onValue(musicStateRef(),snapshot=>{
  const state=snapshot.val();
  if(!state?.videoId)return;
  const isNewRevision=state.revision!==lastAppliedRevision;
  latestMusicState=state;

  if(!playerReady){
   $("syncStatus").textContent="Đã nhận bài hát, đang tải YouTube...";
   return;
  }

  if(state.changedBy===user.uid&&!isNewRevision)return;

  if(isNewRevision){
   lastAppliedRevision=state.revision;
   applyMusicState(state,true);
  }else if(state.changedBy!==user.uid){
   applyMusicState(state,false);
  }
 },error=>{
  $("syncStatus").textContent="Lỗi Firebase nhạc: "+error.message;
 });

 // Chỉ cập nhật vị trí khi player thực sự đang phát.
 setInterval(()=>{
  if(!playerReady||!currentVideoId||!latestMusicState||!user)return;
  if(latestMusicState.changedBy!==user.uid)return;
  if(!window.YT?.PlayerState)return;
  if(player.getPlayerState?.()!==YT.PlayerState.PLAYING)return;
  publishPlayerState(true);
 },8000);
}

/* ĐĂNG NHẬP */
$("enter").addEventListener("click",async()=>{
 $("passwordError").textContent="";

 if($("chatPassword").value!=="1409"){
  $("passwordError").textContent="Mật khẩu không đúng!";
  return;
 }

 displayName=$("name").value.trim();
 if(!displayName){
  $("status").textContent="Cậu nhập tên trước nhé.";
  return;
 }

 $("enter").disabled=true;
 $("status").textContent="Đang kết nối...";

 try{
  if(!app){
   app=initializeApp(firebaseConfig);
   auth=getAuth(app);
   db=getDatabase(app);
  }

  const result=await signInAnonymously(auth);
  user=result.user;

  $("login").hidden=true;
  $("chat").hidden=false;

  if(window.YT?.Player)createPlayer();
  startPresence();
  startTypingSync();
  startMusicSync();

  const recent=query(ref(db,"publicChat/messages"),orderByChild("createdAt"),limitToLast(100));

  onValue(recent,snapshot=>{
   messages.replaceChildren();

   snapshot.forEach(item=>{
    const data=item.val()||{};
    const box=document.createElement("div");

    if(data.name==="Thông báo hệ thống"){
     box.className="system-message";

     const text=document.createElement("span");
     text.textContent=data.text||"";

     const time=document.createElement("span");
     time.className="system-time";
     time.textContent=formatTime(data.createdAt);

     box.append(text,time);
     messages.append(box);
     return;
    }

    box.className="message";

    const sender=document.createElement("span");
    sender.className="sender";
    sender.textContent=data.name||"Khách";

    const time=document.createElement("small");
    time.className="message-time";
    time.textContent=formatTime(data.createdAt);

    const header=document.createElement("div");
    header.className="message-header";
    header.append(sender,time);

    const body=document.createElement("div");
    body.className="message-body";
    body.textContent=data.text||"";

    box.append(header,body);
    messages.append(box);
   });

   messages.scrollTop=messages.scrollHeight;
  },error=>{
   $("chatStatus").textContent="Không đọc được tin nhắn: "+error.message;
  });

  await set(push(ref(db,"publicChat/messages")),{
   uid:user.uid,
   name:"Thông báo hệ thống",
   text:displayName+" đã vào chat",
   createdAt:Date.now()
  });

  $("chatStatus").textContent="Đã kết nối.";
 }catch(error){
  console.error(error);
  $("status").textContent="Lỗi kết nối: "+(error.code||error.message);
  $("enter").disabled=false;
 }
});

$("chatPassword").addEventListener("keydown",e=>{
 if(e.key==="Enter")$("enter").click();
});

$("name").addEventListener("keydown",e=>{
 if(e.key==="Enter")$("enter").click();
});

/* GỬI TIN NHẮN */
$("composer").addEventListener("submit",async event=>{
 event.preventDefault();

 const text=$("message").value.trim();
 if(!text||!user)return;

 const button=$("composer").querySelector('button[type="submit"]');
 button.disabled=true;

 try{
  await set(push(ref(db,"publicChat/messages")),{
   uid:user.uid,
   name:displayName,
   text,
   createdAt:Date.now()
  });

  floatHearts();

  clearTimeout(typingWriteTimer);
  clearTimeout(typingClearTimer);
  lastTypingText="";

  await set(myTypingRef(),null).catch(()=>{});

  $("message").value="";
  $("message").focus();
 }catch(error){
  $("chatStatus").textContent="Gửi tin nhắn lỗi: "+error.message;
 }finally{
  button.disabled=false;
 }
});
    /* TÌM KIẾM YOUTUBE */
$("musicForm").addEventListener("submit",async event=>{
 event.preventDefault();
 const term=$("musicQuery").value.trim();
 if(!term)return;

 setMusicError("");
 $("musicResults").replaceChildren();
 $("musicResults").classList.remove("hidden");

 if(!YOUTUBE_API_KEY){
  setMusicError("Chưa cấu hình YouTube API key.");
  return;
 }

 const button=$("musicForm").querySelector("button");
 button.disabled=true;
 button.textContent="Đang tìm...";

 try{
  const endpoint=new URL("https://www.googleapis.com/youtube/v3/search");
  endpoint.search=new URLSearchParams({
   part:"snippet",
   type:"video",
   maxResults:"8",
   q:term,
   key:YOUTUBE_API_KEY
  }).toString();

  const response=await fetch(endpoint);
  const data=await response.json();

  if(!response.ok){
   const reason=data.error?.errors?.[0]?.reason||data.error?.status||"UNKNOWN";
   const detail=data.error?.message||"Không rõ nguyên nhân";
   let tip="";

   if(reason==="keyInvalid")tip=" Kiểm tra API key.";
   else if(reason==="quotaExceeded")tip=" API đã hết hạn mức trong ngày.";
   else if(reason==="accessNotConfigured")tip=" Hãy bật YouTube Data API v3 trong Google Cloud.";
   else if(reason==="ipRefererBlocked"||reason==="API_KEY_HTTP_REFERRER_BLOCKED")tip=" Kiểm tra giới hạn website (HTTP referrer) của API key.";
   else if(reason==="forbidden")tip=" Kiểm tra quyền truy cập API và giới hạn của key.";

   throw new Error(reason+": "+detail+tip);
  }

  if(!data.items?.length){
   setMusicError("Không tìm thấy video. Thử từ khóa khác nhé.");
   return;
  }

  let count=0;

  for(const item of data.items){
   const id=item.id?.videoId;
   if(!id)continue;
   count++;

   const snippet=item.snippet||{};
   const btn=document.createElement("button");
   btn.type="button";
   btn.className="song";

   const img=document.createElement("img");
   img.src=snippet.thumbnails?.medium?.url||snippet.thumbnails?.default?.url||"";
   img.alt="Ảnh video";

   const info=document.createElement("div");

   const title=document.createElement("div");
   title.className="song-title";
   title.textContent=snippet.title||"Video YouTube";

   const channel=document.createElement("div");
   channel.className="song-channel";
   channel.textContent=snippet.channelTitle||"YouTube";

   info.append(title,channel);
   btn.append(img,info);

   btn.addEventListener("click",async()=>{
    if(!user){
     setMusicError("Hãy vào phòng chat trước khi chọn nhạc.");
     return;
    }

    const revision=Date.now();
    const state={
     videoId:id,
     title:snippet.title||"Nhạc YouTube",
     position:0,
     playing:true,
     updatedAt:revision,
     revision,
     changedBy:user.uid
    };

    $("musicResults").classList.add("hidden");
    $("playerWrap").hidden=false;
    setMusicError("🎵 Đang chọn: "+state.title);
    $("syncStatus").textContent="Đang gửi bài mới tới cả phòng...";

    latestMusicState=state;
    currentVideoId=id;
    lastAppliedRevision=revision;

    try{
     await set(musicStateRef(),state);

     if(playerReady){
      applyingRemoteState=true;
      player.loadVideoById({videoId:id,startSeconds:0});
      setTimeout(()=>{applyingRemoteState=false},900);
     }

     $("syncStatus").textContent="Đã gửi bài mới cho cả phòng.";
    }catch(error){
     $("syncStatus").textContent="Không đổi được nhạc: "+error.message;
    }
   });

   $("musicResults").append(btn);
  }

  if(!count)setMusicError("Không có video hợp lệ trong kết quả.");
 }catch(error){
  console.error(error);
  setMusicError("Lỗi YouTube: "+error.message);
 }finally{
  button.disabled=false;
  button.textContent="Tìm";
 }
});
</script>
</body>
</html>
