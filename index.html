<style>

#login,#chat{background:white;padding:18px;border-radius:14px;box-shadow:0 2px 10px #0001}
input,button{padding:11px;border-radius:8px;font-size:14px}

button{border:0;background:#6750a4;color:white;cursor:pointer}
button:disabled{opacity:.5}
#name,#chatPassword{width:100%;margin:10px 0}
#enter{width:100%}
#passwordError{color:#c62828}
#status,#chatStatus{font-size:13px;color:#666}
#chatLayout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px}
#chatMain,#sidePanel{min-width:0}
#messages{

 padding:10px;margin:8px 0 12px;border-radius:8px;

 background-size:cover;background-position:center

/* CHỌN AVATAR */
#avatarPicker{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.avatar-option{
 width:43px;height:43px;padding:0;border-radius:50%;
 background:#f3edff;border:2px solid transparent;
 font-size:24px;display:flex;align-items:center;justify-content:center
}
.avatar-option.selected{border-color:#6750a4;background:#e3d7ff}
.avatar-option:focus-visible{outline:2px solid #6750a4;outline-offset:2px}
.avatar{width:34px;height:34px;flex:0 0 34px;border-radius:50%;
 display:flex;align-items:center;justify-content:center;
 background:#f3edff;font-size:21px;overflow:hidden}
.message{display:flex;align-items:flex-start;gap:8px;margin:9px 0}
.message-content{flex:1;min-width:0;padding:9px 10px;border:2px solid #e91e63;border-radius:12px;overflow-wrap:anywhere;background:#fffdfd}
.message-header{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:5px}
.sender{font-size:12px;font-weight:bold;color:#6750a4}
.message-time{color:#999;font-size:10px}
.message-body{white-space:pre-wrap;line-height:1.5}
.system-message{width:fit-content;max-width:95%;margin:12px auto;padding:7px 12px;border-radius:999px;background:#f3e8ff;color:#6750a4;font-size:13px;overflow-wrap:anywhere;text-align:center}
.system-time{margin-left:6px;color:#999;font-size:11px}
#composer{display:flex;gap:8px}
#message{flex:1;width:100%}
#typingIndicator{min-height:0;margin:5px 2px 0;color:#6750a4;font-size:12px;line-height:1.45;overflow-wrap:anywhere}
.typing-user{padding:6px 9px;margin:4px 0;background:#f5f0ff;border-radius:8px;border-left:3px solid #a78bfa}
.typing-draft{color:#444;white-space:pre-wrap;overflow-wrap:anywhere}

/* NÚT ÂM THANH NHỎ */
#soundControls{display:flex;align-items:center;gap:6px;margin:2px 0 4px}
#soundToggle{margin:0;border:1px solid #d8c9ff;border-radius:15px;padding:4px 8px;background:#f3edff;color:#6750a4;font-size:11px;line-height:1.3}
#soundStatus{font-size:10px;color:#777}

#onlinePanel,#musicPanel{border:1px solid #e1dced;border-radius:12px;background:white;padding:14px}
.online-heading,.music-heading{font-weight:bold;color:#6750a4;margin-bottom:10px}
#onlineList{display:flex;flex-direction:column;gap:8px}
.online-user{display:flex;align-items:center;gap:8px;padding:8px;background:#f5f2fc;border-radius:9px;min-width:0}
.online-user .avatar{width:30px;height:30px;flex-basis:30px;font-size:19px}
.online-name{font-size:13px;overflow-wrap:anywhere;min-width:0}
.online-dot{color:#16a34a;font-size:11px}
#onlineEmpty{font-size:13px;color:#777}
#musicPanel{margin-top:14px}
#musicForm{display:flex;gap:6px}
#musicQuery{width:100%;font-size:13px}
#musicForm button{flex-shrink:0}
#musicError{font-size:12px;color:#b42318;line-height:1.5;overflow-wrap:anywhere}
#musicResults{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.song{display:flex;gap:8px;align-items:center;text-align:left;background:#f5f2fc;color:#222;padding:7px;width:100%;border:1px solid #e5def5}
.song img{width:84px;aspect-ratio:16/9;object-fit:cover;border-radius:5px;flex-shrink:0}
.song-title{font-size:13px;font-weight:bold;line-height:1.3}
.song-channel{font-size:11px;color:#666;margin-top:4px}

#player{width:100%;height:100%}

@keyframes heartFly{0%{opacity:0;transform:translate(-50%,0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--drift)),-140px) scale(.8)}}

@media(max-width:700px){

 #musicForm button{width:100%}
}
@media(prefers-reduced-motion:reduce){.rabbit,.floating-heart{animation:none}}

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {
 getDatabase,ref,push,set,onValue,query,orderByChild,
 limitToLast,onDisconnect
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

/* Firebase config */
const firebaseConfig={
 apiKey:"AIzaSyAlJdZGJYij_AOYMEawBgYnBRkBeHOsoeg",
 authDomain:"amino-c6032.firebaseapp.com",
 databaseURL:"https://amino-c6032-default-rtdb.asia-southeast1.firebasedatabase.app/",
 projectId:"amino-c6032",
 appId:"1:659773931860:web:c101fc013c28a1b4e508c1"
};

/* YouTube Data API key */
const YOUTUBE_API_KEY="AIzaSyB7iduznYdwJQbY4x6uWDlXjSS-Gz6dqdQ";

const $=id=>document.getElementById(id);
const messages=$("messages");

let app,auth,db,user,displayName,selectedAvatar="🐰";
let presenceStarted=false,musicListenerStarted=false;
let presenceCache={};
let typingListenerStarted=false;
let typingWriteTimer=null,typingClearTimer=null;
let lastTypingText="";
let knownMessageKeys=new Set(),firstMessagesSnapshot=true;

/* AVATAR PICKER */
document.querySelectorAll(".avatar-option").forEach(button=>{
 button.addEventListener("click",()=>{
  selectedAvatar=button.dataset.avatar;
  document.querySelectorAll(".avatar-option").forEach(item=>{
   const selected=item===button;
   item.classList.toggle("selected",selected);
   item.setAttribute("aria-pressed",String(selected));
  });
 });
});

function avatarElement(avatar){
 const el=document.createElement("div");
 el.className="avatar";
 el.textContent=avatar||"🐰";
 el.setAttribute("aria-label","Avatar");
 return el;
}

/* SOUND */
let audioContext=null;
let soundEnabled=false;

function getAudioContext(){
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC)return null;
 if(!audioContext)audioContext=new AC();
 return audioContext;
}

function tone(freq,delay,duration,volume){
 if(!soundEnabled)return;
 const ctx=getAudioContext();
 if(!ctx||ctx.state!=="running")return;

 const start=ctx.currentTime+delay;
 const oscillator=ctx.createOscillator();
 const gain=ctx.createGain();
 oscillator.type="sine";
 oscillator.frequency.setValueAtTime(freq,start);
 gain.gain.setValueAtTime(.001,start);
 gain.gain.exponentialRampToValueAtTime(volume,start+.025);
 gain.gain.exponentialRampToValueAtTime(.001,start+duration);
 oscillator.connect(gain);
 gain.connect(ctx.destination);
 oscillator.start(start);
 oscillator.stop(start+duration+.02);
}

function messageSound(){
 tone(880,0,.13,.045);
 tone(1175,.09,.18,.035);
}
function systemSound(){
 tone(660,0,.16,.045);
 tone(880,.20,.20,.04);
}

$("soundToggle").addEventListener("click",async()=>{
 const ctx=getAudioContext();
 if(!ctx){$("soundStatus").textContent="Không hỗ trợ";return;}

 try{
  if(!soundEnabled){
   if(ctx.state!=="running")await ctx.resume();
   soundEnabled=true;
   $("soundToggle").textContent="🔔 Âm thanh";
   $("soundToggle").setAttribute("aria-pressed","true");
   $("soundStatus").textContent="Đã bật";
   messageSound();
  }else{
   soundEnabled=false;
   $("soundToggle").textContent="🔇 Âm thanh";
   $("soundToggle").setAttribute("aria-pressed","false");
   $("soundStatus").textContent="Đang tắt";
  }
 }catch(error){
  $("soundStatus").textContent="Bấm lại để bật";
 }
});

function checkNewMessageSounds(snapshot){
 const currentKeys=new Set();
 const newMessages=[];

 snapshot.forEach(child=>{
  currentKeys.add(child.key);
  if(!knownMessageKeys.has(child.key))newMessages.push(child.val()||{});
 });

 if(firstMessagesSnapshot){
  knownMessageKeys=currentKeys;
  firstMessagesSnapshot=false;
  return;
 }

 knownMessageKeys=currentKeys;

 for(const data of newMessages){
  if(!user||!data.uid||data.uid===user.uid)continue;
  if(data.name==="Thông báo hệ thống"||data.type==="system")systemSound();
  else messageSound();
 }
}

/* MESSAGE RENDER */
function formatTime(timestamp){
 if(typeof timestamp!=="number")return "";
 return new Date(timestamp).toLocaleTimeString("vi-VN",{
  timeZone:"Asia/Ho_Chi_Minh",
  hour:"2-digit",minute:"2-digit",hour12:false
 });
}

function renderMessages(snapshot){
 messages.replaceChildren();

 snapshot.forEach(item=>{
  const data=item.val()||{};
  const box=document.createElement("div");

  if(data.name==="Thông báo hệ thống"){
   box.className="system-message";
   box.append(document.createTextNode(data.text||""));

   const time=document.createElement("span");
   time.className="system-time";
   time.textContent=formatTime(data.createdAt);
   box.append(time);
   messages.append(box);
   return;
  }

  box.className="message";
  const avatar=avatarElement(presenceCache[data.uid]?.avatar||"🐰");

  const content=document.createElement("div");
  content.className="message-content";

  const head=document.createElement("div");
  head.className="message-header";

  const name=document.createElement("span");
  name.className="sender";
  name.textContent=data.name||"Khách";

  const time=document.createElement("span");
  time.className="message-time";
  time.textContent=formatTime(data.createdAt);

  head.append(name,time);

  const body=document.createElement("div");
  body.className="message-body";
  body.textContent=data.text||"";

  content.append(head,body);
  box.append(avatar,content);
  messages.append(box);
 });

 messages.scrollTop=messages.scrollHeight;
}

/* FLOATING HEARTS */
function floatHearts(){
 const button=$("composer").querySelector('button[type="submit"]');
 const rect=button.getBoundingClientRect();
 for(let i=0;i<5;i++){
  const heart=document.createElement("span");
  heart.className="floating-heart";
  heart.textContent=["💗","💕","💖","💘","❤️"][Math.floor(Math.random()*5)];
  heart.style.left=(rect.left+rect.width/2+(Math.random()-.5)*80)+"px";
  heart.style.top=rect.top+rect.height/2+"px";
  heart.style.fontSize=(16+Math.random()*14)+"px";
  heart.style.setProperty("--drift",((Math.random()-.5)*90)+"px");
  document.body.append(heart);
  heart.addEventListener("animationend",()=>heart.remove(),{once:true});
 }
}

/* PRESENCE AND ONLINE AVATARS */
function startPresence(){
 if(presenceStarted)return;
 presenceStarted=true;

 onValue(ref(db,".info/connected"),async snapshot=>{
  if(snapshot.val()!==true)return;

  const connectionRef=push(ref(db,`presence/${user.uid}/connections`));

  try{
   await onDisconnect(connectionRef).remove();
   await set(ref(db,`presence/${user.uid}/name`),displayName);
   await set(ref(db,`presence/${user.uid}/avatar`),selectedAvatar);
   await set(connectionRef,true);
  }catch(error){
   $("chatStatus").textContent="Lỗi trạng thái online: "+error.message;
  }
 });

 onValue(ref(db,"presence"),snapshot=>{
  presenceCache={};
  const list=$("onlineList");
  list.replaceChildren();
  let count=0;

  snapshot.forEach(item=>{
   const data=item.val()||{};
   presenceCache[item.key]=data;

   if(!Object.keys(data.connections||{}).length)return;
   count++;

   const row=document.createElement("div");
   row.className="online-user";
   row.append(avatarElement(data.avatar||"🐰"));

   const dot=document.createElement("span");
   dot.className="online-dot";
   dot.textContent="●";

   const name=document.createElement("span");
   name.className="online-name";
   name.textContent=data.name||"Khách";

   row.append(dot,name);
   list.append(row);
  });

  $("onlineCount").textContent=String(count);
  if(!count){
   const empty=document.createElement("div");
   empty.id="onlineEmpty";
   empty.textContent="Chưa có ai trực tuyến.";
   list.append(empty);
  }

  // Cập nhật avatar cạnh tin nhắn nếu dữ liệu presence vừa tải xong.
  if(!firstMessagesSnapshot){
   const recent=query(ref(db,"publicChat/messages"),orderByChild("createdAt"),limitToLast(100));
   // Không cần tạo listener mới; render sẽ được cập nhật từ snapshot cache bên dưới.
   if(lastMessageSnapshot)renderMessages(lastMessageSnapshot);
  }
 },error=>{
  $("chatStatus").textContent="Không tải được online: "+error.message;
 });
}

/* LIVE TYPING DRAFTS: hiển thị nội dung đang gõ cho mọi người trong phòng */
function myTypingRef(){
 return ref(db,`typing/${user.uid}`);
}

async function publishTypingDraft(){
 if(!user||!db)return;
 const draft=$("message").value;
 const ownRef=myTypingRef();
 clearTimeout(typingClearTimer);

 if(!draft.trim()){
  lastTypingText="";
  try{await set(ownRef,null)}catch(error){console.warn("Không xóa được trạng thái nhập:",error)}
  return;
 }

 // Không ghi lại Firebase nếu nội dung chưa thay đổi.
 if(draft===lastTypingText)return;
 lastTypingText=draft;
 try{
  await set(ownRef,{
   uid:user.uid,
   name:displayName,
   avatar:selectedAvatar,
   text:draft.slice(0,1000),
   updatedAt:Date.now()
  });
 }catch(error){
  console.warn("Không cập nhật được nội dung đang nhập:",error);
 }

 // Tự dọn trạng thái nếu người dùng bỏ đi mà không gửi tin.
 typingClearTimer=setTimeout(async()=>{
  if(!user)return;
  // 12 giây không gõ thêm thì ẩn bản nháp khỏi phòng, nhưng giữ nguyên chữ trong ô nhập của người đó.
  if($("message").value===draft){
   try{await set(ownRef,null)}catch(error){console.warn("Không dọn được bản nháp cũ:",error)}
   lastTypingText="";
  }
 },12000);
}

function startTypingSync(){
 if(typingListenerStarted)return;
 typingListenerStarted=true;
 const input=$("message");
 input.addEventListener("input",()=>{
  clearTimeout(typingWriteTimer);
  typingWriteTimer=setTimeout(publishTypingDraft,120);
 });

 // Xóa bản nháp trên server khi tab/ngắt kết nối.
 onDisconnect(myTypingRef()).remove().catch(error=>console.warn("Không đăng ký được dọn trạng thái nhập:",error));

 onValue(ref(db,"typing"),snapshot=>{
  const container=$("typingIndicator");
  container.replaceChildren();
  const now=Date.now();
  let count=0;
  snapshot.forEach(child=>{
   const data=child.val();
   if(!data||child.key===user?.uid||typeof data.text!=="string"||!data.text.trim())return;
   // Bỏ qua bản nháp cũ nếu người kia đã rời tab hoặc mất kết nối.
   if(now-(Number(data.updatedAt)||0)>15000)return;
   count++;
   const row=document.createElement("div");
   row.className="typing-user";
   const heading=document.createElement("strong");
   heading.textContent=`${data.avatar||"🐰"} ${data.name||"Ai đó"} đang nhập:`;
   const draft=document.createElement("div");
   draft.className="typing-draft";
   draft.textContent=data.text;
   row.append(heading,draft);
   container.append(row);
  });
  if(!count)container.replaceChildren();
 },error=>{
  $("chatStatus").textContent="Không tải được nội dung đang nhập: "+error.message;
 });
}

/* YOUTUBE SHARED MUSIC */
let player=null,playerReady=false,currentVideoId="";
let latestMusicState=null,lastRevision=null,applyingRemote=false;
let lastMessageSnapshot=null;

window.createAminoPlayer=function(){
 if(player||!window.YT?.Player)return;

 player=new YT.Player("player",{
  width:"100%",height:"100%",
  playerVars:{autoplay:0,controls:1,playsinline:1,rel:0},
  events:{
   onReady:()=>{
    playerReady=true;
    if(latestMusicState)applyMusicState(latestMusicState,true);
   },
   onStateChange:event=>{
    if(applyingRemote||!user||!currentVideoId)return;
    if(event.data===YT.PlayerState.PLAYING)publishMusic(true);
    if(event.data===YT.PlayerState.PAUSED)publishMusic(false);
    if(event.data===YT.PlayerState.ENDED)publishMusic(false);
   },
   onError:event=>{
    $("syncStatus").textContent="Video này có thể không cho phép nhúng. Hãy chọn bài khác.";
   }
  }
 });
};

function targetPosition(state){
 const pos=Number(state.position)||0;
 return state.playing?pos+Math.max(0,Date.now()-(Number(state.updatedAt)||Date.now()))/1000:pos;
}

function applyMusicState(state,force=false){
 if(!state?.videoId||!playerReady||!player)return;

 const changed=state.videoId!==currentVideoId;
 const target=targetPosition(state);
 applyingRemote=true;
 $("playerWrap").hidden=false;

 try{
  if(changed){
   currentVideoId=state.videoId;
   if(state.playing)player.loadVideoById({videoId:state.videoId,startSeconds:target});
   else player.cueVideoById({videoId:state.videoId,startSeconds:target});
  }else{
   const actual=Number(player.getCurrentTime?.())||0;
   if(force||Math.abs(actual-target)>3)player.seekTo(target,true);
   const ps=player.getPlayerState?.();
   if(state.playing&&ps!==YT.PlayerState.PLAYING)player.playVideo();
   if(!state.playing&&ps===YT.PlayerState.PLAYING)player.pauseVideo();
  }
  $("syncStatus").textContent=state.playing?"🎵 Đang đồng bộ nhạc chung.":"⏸ Nhạc đang tạm dừng.";
 }catch(error){
  $("syncStatus").textContent="Không đồng bộ được video.";
 }

 setTimeout(()=>{applyingRemote=false},1000);
}

async function publishMusic(playing){
 if(!playerReady||!user||!currentVideoId||applyingRemote)return;

 const state={
  videoId:currentVideoId,
  title:latestMusicState?.title||"Nhạc YouTube",
  position:Number(player.getCurrentTime?.())||0,
  playing:!!playing,
  updatedAt:Date.now(),
  revision:Date.now(),
  changedBy:user.uid
 };
 latestMusicState=state;

 try{await set(musicRef(),state)}
 catch(error){$("syncStatus").textContent="Lỗi cập nhật nhạc: "+error.message}
}

function startMusicSync(){
 if(musicListenerStarted)return;
 musicListenerStarted=true;

 onValue(musicRef(),snapshot=>{
  const state=snapshot.val();
  if(!state?.videoId)return;

  latestMusicState=state;
  if(!playerReady)return;

  if(state.revision!==lastRevision){
   lastRevision=state.revision;

   // Bản thân trình duyệt vừa phát trạng thái này lên Firebase thì không
   // cần tự áp dụng lại lên player (tránh seek/play/pause lặp mỗi 6 giây).
   // Ngoại lệ: nếu player chưa nạp video này, vẫn phải nạp trạng thái ban đầu.
   if(state.changedBy===user?.uid && currentVideoId===state.videoId){
    return;
   }

   // Chỉ ép đồng bộ khi đổi video; cùng video thì chỉ sửa lệch vị trí lớn.
   applyMusicState(state, state.videoId!==currentVideoId);
  }
 },error=>{
  $("syncStatus").textContent="Lỗi Firebase nhạc: "+error.message;
 });

 setInterval(()=>{
  if(playerReady&&latestMusicState?.playing&&latestMusicState.changedBy===user.uid)publishMusic(true);
 },6000);
}

/* YOUTUBE SEARCH */
$("musicForm").addEventListener("submit",async event=>{
 event.preventDefault();
 const term=$("musicQuery").value.trim();
 if(!term)return;

 $("musicError").textContent="";
 $("musicResults").replaceChildren();

 const button=$("musicForm").querySelector("button");
 button.disabled=true;
 button.textContent="Đang tìm...";

 try{
  const url=new URL("https://www.googleapis.com/youtube/v3/search");
  url.search=new URLSearchParams({
   part:"snippet",type:"video",maxResults:"8",q:term,key:YOUTUBE_API_KEY
  }).toString();

  const response=await fetch(url);
  const data=await response.json();
  if(!response.ok)throw new Error(data.error?.message||"Lỗi tìm kiếm YouTube.");

  if(!data.items?.length){
   $("musicError").textContent="Không tìm thấy bài hát.";
   return;
  }

  for(const item of data.items){
   const id=item.id?.videoId;
   if(!id)continue;

   const snippet=item.snippet||{};
   const btn=document.createElement("button");
   btn.type="button";
   btn.className="song";

   const img=document.createElement("img");
   img.src=snippet.thumbnails?.medium?.url||"";
   img.alt="Ảnh video";

   const info=document.createElement("div");
   const title=document.createElement("div");
   title.className="song-title";
   title.textContent=snippet.title||"Video YouTube";

   const channel=document.createElement("div");
   channel.className="song-channel";
   channel.textContent=snippet.channelTitle||"YouTube";

   info.append(title,channel);
   btn.append(img,info);

   btn.addEventListener("click",async()=>{
    const revision=Date.now();
    const state={
     videoId:id,
     title:snippet.title||"Nhạc YouTube",
     position:0,
     playing:true,
     updatedAt:revision,
     revision,
     changedBy:user.uid
    };

    latestMusicState=state;
    currentVideoId=id;
    lastRevision=revision;
    $("playerWrap").hidden=false;
    $("musicResults").replaceChildren();
    $("musicError").textContent="Đang chọn: "+state.title;

    try{
     await set(musicRef(),state);
     if(playerReady){
      applyingRemote=true;
      player.loadVideoById({videoId:id,startSeconds:0});
      setTimeout(()=>{applyingRemote=false},2000);
     }
     $("syncStatus").textContent="Đã gửi bài hát mới cho cả phòng.";
    }catch(error){
     $("syncStatus").textContent="Không đổi được nhạc: "+error.message;
    }
   });

   $("musicResults").append(btn);
  }
 }catch(error){
  $("musicError").textContent="Lỗi YouTube: "+error.message;
 }finally{
  button.disabled=false;
  button.textContent="Tìm";
 }
});
</script>
