
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amino Chat</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f3f8;color:#222}
header{background:#6750a4;color:#fff;padding:18px;text-align:center;font-size:24px;font-weight:bold}
.amino-title{margin:0;text-align:center;color:#fff}
.rabbit{display:inline-block;animation:rabbitJump 1s ease-in-out infinite}
@keyframes rabbitJump{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
main{max-width:1000px;margin:20px auto;padding:16px}
#login,#chat{background:#fff;padding:18px;border-radius:14px;box-shadow:0 2px 10px #0001}
input,button{box-sizing:border-box;padding:12px;border-radius:8px;font-size:16px}
input{border:1px solid #ccc}
#name,#chatPassword{width:100%;margin:12px 0}
button{border:0;background:#6750a4;color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
#enter{width:100%}
#chatLayout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px;align-items:start}
#chatMain{min-width:0}
#messages{height:55vh;min-height:260px;overflow-y:auto;border:1px solid #ddd;padding:10px;margin:12px 0;border-radius:8px;overflow-wrap:anywhere;background:#faf8ff}
.message{padding:10px;margin:8px 0;border-radius:12px;overflow-wrap:anywhere;border:2px solid #e91e63;border-left-width:6px}
.sender{font-weight:bold;color:#6750a4;margin-bottom:5px}
.message-body{color:#222;line-height:1.5;white-space:pre-wrap}
.system-message{width:fit-content;max-width:95%;margin:12px auto;padding:7px 12px;border-radius:999px;background:#f3e8ff;color:#6750a4;text-align:center;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.system-time{margin-left:6px;color:#999;font-size:11px;white-space:nowrap}
#composer{display:flex;gap:8px}
#message{flex:1;min-width:0}
#status{color:#666;font-size:14px}
#passwordError{color:red}
#onlinePanel,#musicPanel{border:1px solid #e1dced;border-radius:12px;background:#fff;padding:14px}
.online-heading,.music-heading{font-weight:bold;color:#6750a4;margin-bottom:10px}
#onlineList{display:flex;flex-direction:column;gap:8px}
.online-user{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;background:#f5f2fc;overflow-wrap:anywhere}
.online-dot{color:#16a34a;font-size:12px}
.online-name{font-size:14px;overflow-wrap:anywhere}
#onlineEmpty{color:#777;font-size:13px;line-height:1.4}
#musicPanel{margin-top:14px}
#musicForm{display:flex;gap:6px}
#musicQuery{width:100%;min-width:0;font-size:14px;padding:10px}
#musicForm button{flex-shrink:0;padding:10px}
#musicError{color:#c62828;font-size:12px;line-height:1.5;overflow-wrap:anywhere}
#musicResults{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.song{display:flex;gap:8px;align-items:center;text-align:left;background:#f5f2fc;color:#222;padding:7px;width:100%;border:1px solid #e5def5}
.song img{width:84px;aspect-ratio:16/9;object-fit:cover;border-radius:5px;flex-shrink:0}
.song-title{font-size:13px;font-weight:bold;line-height:1.3}
.song-channel{font-size:11px;color:#666;margin-top:4px}
.song.selected{border:2px solid #6750a4}
#playerWrap{margin-top:10px;width:100%;aspect-ratio:16/9;background:#111;border-radius:8px;overflow:hidden}
#musicPlayer{width:100%;height:100%;border:0;display:block}
.hint{font-size:12px;line-height:1.4;color:#777;margin:8px 0 0}
.floating-heart{position:fixed;z-index:9999;pointer-events:none;user-select:none;line-height:1;animation:heartFly 1.35s ease-out forwards}
@keyframes heartFly{0%{opacity:0;transform:translate(-50%,0) scale(.5)}15%{opacity:1;transform:translate(-50%,-12px) scale(1.1)}100%{opacity:0;transform:translate(calc(-50% + var(--drift)),-150px) scale(.8)}}
@media(max-width:700px){
main{margin:10px auto;padding:10px}
#chatLayout{grid-template-columns:1fr}
#onlineList{flex-direction:row;flex-wrap:wrap}
#musicForm{flex-direction:column}
#musicForm button{width:100%}
}
@media(prefers-reduced-motion:reduce){.rabbit,.floating-heart{animation:none}}
</style>
</head>

<body>
<header>
<h1 class="amino-title"><span class="rabbit">🐰</span> Amino Chat <span class="rabbit">🐇</span></h1>
</header>

<main>
<section id="login">
<p>Nhập mật khẩu để vào Amino Chat</p>
<input id="chatPassword" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password">
<p id="passwordError" aria-live="polite"></p>
<h3>Chào mừng đến Amino Chat!</h3>
<p>Nhập tên của bạn để vào phòng chat cùng Amino nhé.</p>
<input id="name" maxlength="24" placeholder="Tên hiển thị của bạn">
<button id="enter" type="button">Vào chat thui 👆</button>
<p id="status">Sẵn sàng kết nối.</p>
</section>

<section id="chat" hidden>
<h3>Currently testing the system</h3>
<p id="welcome"></p>

<div id="chatLayout">
<div id="chatMain">
<div id="messages"></div>
<form id="composer">
<input id="message" maxlength="1000" placeholder="Nhập tin nhắn ở đây nè cậu..." autocomplete="off" required>
<button type="submit">Gửi</button>
</form>
<p id="chatStatus" aria-live="polite"></p>
</div>

<div id="sidePanel">
<aside id="onlinePanel">
<div class="online-heading">👥 Đang trực tuyến (<span id="onlineCount">0</span>)</div>
<div id="onlineList"><div id="onlineEmpty">Đang tải danh sách...</div></div>
</aside>

<section id="musicPanel" aria-label="Tìm nhạc YouTube">
<div class="music-heading">🎵 Tìm bài hát YouTube</div>
<form id="musicForm">
<input id="musicQuery" placeholder="Nhập tên bài hát / ca sĩ..." aria-label="Tên bài hát" required>
<button type="submit">Tìm</button>
</form>
<p class="hint">Nhập tên bài hát, chọn kết quả bên dưới để phát.</p>
<p id="musicError" aria-live="polite"></p>
<div id="musicResults"></div>

<div id="playerWrap" hidden>
<iframe id="musicPlayer" title="Trình phát YouTube"
src="about:blank"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
referrerpolicy="strict-origin-when-cross-origin"
allowfullscreen></iframe>
</div>
</section>
</div>
</div>
</section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {
getDatabase,ref,push,set,onValue,query,orderByChild,
limitToLast,serverTimestamp,onDisconnect
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyAlJdZGJYij_AOYMEawBgYnBRkBeHOsoeg",
authDomain:"amino-c6032.firebaseapp.com",
databaseURL:"https://amino-c6032-default-rtdb.asia-southeast1.firebasedatabase.app/",
projectId:"amino-c6032",
appId:"1:659773931860:web:c101fc013c28a1b4e508c1"
};

// DÁN YOUTUBE DATA API KEY VÀO ĐÂY
const YOUTUBE_API_KEY="AIzaSyB7iduznYdwJQbY4x6uWDlXjSS-Gz6dqdQ";

const $=id=>document.getElementById(id);
const login=$("login"),chat=$("chat"),status=$("status");
const chatStatus=$("chatStatus"),messages=$("messages");
const enter=$("enter"),passwordInput=$("chatPassword");
const passwordError=$("passwordError"),nameInput=$("name");
const composer=$("composer"),messageInput=$("message");
const onlineList=$("onlineList"),onlineCount=$("onlineCount");

let db,user,displayName,app,auth;
let presenceListenerStarted=false;

function formatTime(timestamp){
if(typeof timestamp!=="number")return "";
return new Date(timestamp).toLocaleTimeString("vi-VN",{
timeZone:"Asia/Ho_Chi_Minh",
hour:"2-digit",minute:"2-digit",hour12:false
});
}

function floatHearts(){
const hearts=["💗","💕","💖","💘","❤️","💓"];
const button=composer.querySelector('button[type="submit"]');
const rect=button.getBoundingClientRect();
const x=rect.left+rect.width/2,y=rect.top+rect.height/2;

for(let i=0;i<6;i++){
const heart=document.createElement("span");
heart.className="floating-heart";
heart.textContent=hearts[Math.floor(Math.random()*hearts.length)];
heart.style.left=`${x+(Math.random()-.5)*90}px`;
heart.style.top=`${y}px`;
heart.style.fontSize=`${16+Math.random()*15}px`;
heart.style.setProperty("--drift",`${(Math.random()-.5)*100}px`);
document.body.append(heart);
heart.addEventListener("animationend",()=>heart.remove(),{once:true});
}
}

function startPresence(){
if(presenceListenerStarted)return;
presenceListenerStarted=true;

const connectedRef=ref(db,".info/connected");
const connectionsRef=ref(db,`presence/${user.uid}/connections`);

onValue(connectedRef,async s=>{
if(s.val()!==true)return;
const connectionRef=push(connectionsRef);

try{
await onDisconnect(connectionRef).remove();
await set(ref(db,`presence/${user.uid}/name`),displayName);
await set(connectionRef,true);
chatStatus.textContent="Đã kết nối và cập nhật trạng thái online.";
}catch(e){
chatStatus.textContent="Không cập nhật được online: "+(e.code||e.message);
}
});

onValue(ref(db,"presence"),snapshot=>{
onlineList.replaceChildren();
let count=0;

snapshot.forEach(item=>{
const data=item.val()||{};
const connections=data.connections||{};
if(!Object.keys(connections).length)return;

count++;
const member=document.createElement("div");
member.className="online-user";

const dot=document.createElement("span");
dot.className="online-dot";
dot.textContent="●";

const name=document.createElement("span");
name.className="online-name";
name.textContent=data.name||"Khách";

member.append(dot,name);
onlineList.append(member);
});

onlineCount.textContent=String(count);

if(!count){
const empty=document.createElement("div");
empty.id="onlineEmpty";
empty.textContent="Chưa có ai trực tuyến.";
onlineList.append(empty);
}
},()=>{
onlineList.textContent="Không tải được danh sách online. Kiểm tra Rules Firebase.";
});
}

enter.addEventListener("click",async()=>{
passwordError.textContent="";
chatStatus.textContent="";

if(passwordInput.value!=="1409"){
passwordError.textContent="Mật khẩu không đúng!";
passwordInput.focus();
return;
}

displayName=nameInput.value.trim();

if(!displayName){
status.textContent="Bạn hãy nhập tên trước nhé.";
nameInput.focus();
return;
}

if(displayName.length>24){
status.textContent="Tên hiển thị tối đa 24 ký tự.";
return;
}

enter.disabled=true;
status.textContent="Đang kết nối...";

try{
if(!app){
app=initializeApp(firebaseConfig);
auth=getAuth(app);
db=getDatabase(app);
}

const result=await signInAnonymously(auth);
user=result.user;

login.hidden=true;
chat.hidden=false;
$("welcome").textContent="Bạn đang trò chuyện với tên "+displayName;

startPresence();

const recent=query(
ref(db,"publicChat/messages"),
orderByChild("createdAt"),
limitToLast(100)
);

onValue(recent,snapshot=>{
messages.replaceChildren();

snapshot.forEach(item=>{
const data=item.val()||{};
const box=document.createElement("div");

if(data.name==="Thông báo hệ thống"){
box.className="system-message";

const t=document.createElement("span");
t.textContent=data.text||"";

const tm=document.createElement("span");
tm.className="system-time";
tm.textContent=formatTime(data.createdAt);

box.append(t,tm);
messages.append(box);
return;
}

box.className="message";

const sender=document.createElement("div");
sender.className="sender";
sender.textContent=data.name||"Khách";

const body=document.createElement("div");
body.className="message-body";
body.textContent=data.text||"";

const time=document.createElement("small");
time.style.cssText="display:block;color:#777;font-size:12px";
time.textContent=typeof data.createdAt==="number"
?formatTime(data.createdAt)
:"Đang cập nhật giờ...";

box.append(sender,body,time);
messages.append(box);
});

messages.scrollTop=messages.scrollHeight;
},()=>{
chatStatus.textContent="Không đọc được tin nhắn. Kiểm tra Rules Firebase.";
});

chatStatus.textContent="Đã kết nối.";

set(push(ref(db,"publicChat/messages")),{
uid:user.uid,
name:"Thông báo hệ thống",
text:`${displayName} đã vào chat`,
createdAt:serverTimestamp()
}).catch(e=>console.error(e));

}catch(e){
console.error(e);
status.textContent="Không kết nối được Firebase: "+(e.code||e.message||"Lỗi không xác định");
enter.disabled=false;
}
});

passwordInput.addEventListener("keydown",e=>{
if(e.key==="Enter")enter.click();
});

nameInput.addEventListener("keydown",e=>{
if(e.key==="Enter")enter.click();
});

composer.addEventListener("submit",async e=>{
e.preventDefault();

const text=messageInput.value.trim();
if(!text||!user||!db)return;

const button=composer.querySelector('button[type="submit"]');
button.disabled=true;

try{
await set(push(ref(db,"publicChat/messages")),{
uid:user.uid,
name:displayName,
text,
createdAt:serverTimestamp()
});

floatHearts();
messageInput.value="";
chatStatus.textContent="";
messageInput.focus();

}catch(e){
chatStatus.textContent="Gửi chưa được. Kiểm tra quyền Realtime Database.";
}finally{
button.disabled=false;
}
});

// TÌM KIẾM BÀI HÁT TRÊN YOUTUBE
const musicForm=$("musicForm");
const musicQuery=$("musicQuery");
const musicError=$("musicError");
const musicResults=$("musicResults");
const musicPlayer=$("musicPlayer");
const playerWrap=$("playerWrap");

musicForm.addEventListener("submit",async e=>{
e.preventDefault();

musicError.textContent="";
musicResults.replaceChildren();

const term=musicQuery.value.trim();
if(!term)return;

if(!YOUTUBE_API_KEY||
YOUTUBE_API_KEY==="DAN_API_KEY_CUA_MAY_VAO_DAY"){
musicError.textContent=
"Bạn cần thêm YouTube Data API key để tìm bài hát. Xem hướng dẫn bên dưới.";
return;
}

const button=musicForm.querySelector("button");
button.disabled=true;
button.textContent="Đang tìm...";

try{
const endpoint=new URL("https://www.googleapis.com/youtube/v3/search");

endpoint.search=new URLSearchParams({
part:"snippet",
type:"video",
videoCategoryId:"10",
maxResults:"8",
q:term,
key:YOUTUBE_API_KEY
}).toString();

const response=await fetch(endpoint);
const data=await response.json();

if(!response.ok){
throw new Error(data.error?.message||"Không tìm kiếm được YouTube.");
}

if(!data.items?.length){
musicError.textContent="Không tìm thấy kết quả. Thử tên bài hát khác nhé.";
return;
}

data.items.forEach(item=>{
const id=item.id?.videoId;
if(!id)return;

const snippet=item.snippet||{};
const btn=document.createElement("button");
btn.type="button";
btn.className="song";

const img=document.createElement("img");
img.src=snippet.thumbnails?.medium?.url||
snippet.thumbnails?.default?.url||"";
img.alt="Ảnh video";

const info=document.createElement("div");
const title=document.createElement("div");
const channel=document.createElement("div");

title.className="song-title";
title.textContent=snippet.title||"Video YouTube";

channel.className="song-channel";
channel.textContent=snippet.channelTitle||"YouTube";

info.append(title,channel);
btn.append(img,info);

btn.addEventListener("click",()=>{
musicPlayer.src=
"https://www.youtube-nocookie.com/embed/"+
encodeURIComponent(id)+"?autoplay=1";

playerWrap.hidden=false;

musicResults.querySelectorAll(".song").forEach(x=>{
x.classList.remove("selected");
});

btn.classList.add("selected");
musicError.textContent="Đang phát: "+(snippet.title||"bài hát đã chọn");
});

musicResults.append(btn);
});

}catch(err){
musicError.textContent=
"Lỗi tìm kiếm: "+err.message+
". Kiểm tra API key và quyền YouTube Data API v3.";
}finally{
button.disabled=false;
button.textContent="Tìm";
}
});
</script>
</body>
</html>
